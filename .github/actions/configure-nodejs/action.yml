name: 'Configure Node.js'
description: 'Install Node.js and install Node.js modules or restore cache'

inputs:
  node-version:
    description: 'NodeJS Version'
    default: '24'
  npm-version:
    description: 'npm version used to install and publish with the validated lockfile'
    default: '11.19.1'
  registry-url:
    description: 'Optional npm registry for token authentication via NODE_AUTH_TOKEN'
    default: ''
  lookup-only:
    description: 'If true, only checks if cache entry exists and skips download. Does not change save cache behavior'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        # Preserve the explicit node_modules cache rather than enabling another
        # cache when a future manifest declares npm as its package manager.
        package-manager-cache: false

    - name: Select npm version
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
        NPM_CONFIG_MIN_RELEASE_AGE: '7'
      run: |
        npm install --global "npm@$NPM_VERSION" --ignore-scripts
        npm config set min-release-age 7 --location=user

    - name: Restore Node Modules from Cache
      id: cache-node-modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/**/node_modules
          !node_modules/.cache
        key: node-modules-${{ inputs.node-version }}-npm-${{ inputs.npm-version }}-min-age-7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json', '**/package-lock.json') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        NPM_CONFIG_MIN_RELEASE_AGE: '7'
      run: npm ci
