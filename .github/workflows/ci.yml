name: Build - CI

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-access:
    runs-on: ubuntu-latest
    outputs:
      has-token-access: ${{ steps.check.outputs.has-token-access }}
    steps:
      - id: check
        env:
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$PR_IS_FORK" != 'true' && "$ACTOR" != 'dependabot[bot]' ]]; then
            echo 'has-token-access=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-token-access=false' >> "$GITHUB_OUTPUT"
          fi

  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/configure-nodejs
        with:
          lookup-only: 'true' # We only want to lookup from the cache - if a hit, this job does nothing

  build:
    needs:
      - install-deps
      - check-access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/configure-nodejs

      - name: Test release metadata
        run: node --test .github/scripts/release-metadata.test.cjs

      - name: Build
        run: npm run build

      - name: Build Docs
        run: npm run build:docs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test package consumers when available
        run: npm run test:package --if-present

      - name: Upload code coverage
        if: github.event_name == 'pull_request' && needs.check-access.outputs.has-token-access == 'true'
        uses: ./.github/actions/coverage-report
        with:
          lcov-file: coverage/lcov.info
          title: Node.js Code Coverage Report

  runtime-tests:
    name: Runtime tests (Node 22.13)
    needs: install-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/configure-nodejs

      - name: Build
        run: npm run build

      - name: Preserve configured npm for the older runtime
        id: runtime-npm
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-npm"
          ln -s "$(command -v npm)" "$RUNNER_TEMP/runtime-npm/npm"
          ln -s "$(command -v npx)" "$RUNNER_TEMP/runtime-npm/npx"
          echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"

      - name: Select older runtime after installing and building on Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Retain npm version and release-age policy with the older runtime
        env:
          EXPECTED_NPM_VERSION: ${{ steps.runtime-npm.outputs.version }}
        run: |
          echo "$RUNNER_TEMP/runtime-npm" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/runtime-npm:$PATH"
          test "$(npm --version)" = "$EXPECTED_NPM_VERSION"
          test "$(npm config get min-release-age)" = '7'

      - name: Test
        run: npm run test

      - name: Test package consumers when available
        run: npm run test:package --if-present
