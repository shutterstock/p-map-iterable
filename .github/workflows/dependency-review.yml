name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Build-time dependencies also execute in CI and release jobs.
          fail-on-scopes: runtime, development, unknown
          license-check: true
          # Pwr app allowlist, plus CC-BY-4.0 for caniuse-lite's browser data.
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0,
            CC-BY-4.0, CC0-1.0, ISC, MIT, MPL-2.0, OFL-1.1, Python-2.0, Unlicense
          # Audited npm artifact and inherited public-domain notices:
          # ../ROBUST-PREDICATES-LICENSE.md. The guard below enforces the version
          # because this pinned action matches license exceptions by name only.
          allow-dependencies-licenses: pkg:npm/robust-predicates@3.0.3
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

      # The action rejects disallowed/invalid licenses, but only warns when
      # no license is detected. Missing metadata also needs human review.
      - name: Reject dependencies without license metadata
        env:
          LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          node <<'JS'
          const report = JSON.parse(process.env.LICENSE_CHANGES);
          if (!Array.isArray(report.unlicensed)) {
            throw new Error('Dependency review did not return license metadata.');
          }
          for (const dependency of report.unlicensed) {
            console.error(`${dependency.manifest}: ${dependency.name} has no detected license.`);
          }
          if (report.unlicensed.length > 0) process.exit(1);
          JS

      - name: Enforce the exact reviewed license exception
        run: |
          # JSON encoding keeps report contents inside the quoted heredoc;
          # the runner writes this script to disk instead of an environment entry.
          cat > "$RUNNER_TEMP/dependency-review-changes.json" <<'DEPENDENCY_REVIEW_JSON'
          ${{ toJSON(steps.review.outputs.dependency-changes) }}
          DEPENDENCY_REVIEW_JSON
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const encoded = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'dependency-review-changes.json'), 'utf8');
          const changes = JSON.parse(JSON.parse(encoded));
          if (!Array.isArray(changes)) throw new Error('Missing dependency review changes.');
          const auditedLicenses = new Set([
            'Unlicense',
            'LicenseRef-scancode-public-domain AND Unlicense',
          ]);
          for (const change of changes) {
            if (change.change_type === 'removed') continue;
            // Match the pinned action's type/name normalization, including
            // encoded names, so alternative PURL spellings cannot evade this guard.
            const purl = change.package_url;
            const type = purl.match(/pkg:([a-zA-Z0-9-_]+)\/.*/)?.[1];
            if (!purl.startsWith('pkg:') || type?.toLowerCase() !== 'npm') continue;
            const parts = purl.split('/');
            const namespace = parts.length > 2 ? decodeURIComponent(parts[1]) : null;
            const rest = parts.slice(namespace === null ? 1 : 2).join('/');
            const name = rest.match(/([^@#?]+)[@#?]?.*/)?.[1];
            const decodedName = name ? decodeURIComponent(name) : null;
            const fullName = namespace && decodedName
              ? `${namespace}/${decodedName}`
              : decodedName ?? namespace;
            if (fullName?.toLowerCase() !== 'robust-predicates') continue;
            if (
              purl !== 'pkg:npm/robust-predicates@3.0.3' ||
              change.version !== '3.0.3' ||
              !auditedLicenses.has(change.license)
            ) {
              throw new Error(`Unaudited license exception: ${purl} (${change.license}).`);
            }
          }
          JS
