name: Package and Publish

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize registry checks and publication so competing trains cannot move
# latest backwards between the metadata check and npm publish.
concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the published release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release metadata and select npm channel
        id: release
        uses: ./.github/actions/release-metadata

      - uses: ./.github/actions/configure-nodejs
        with:
          registry-url: https://registry.npmjs.org/

      - name: Test release metadata
        run: node --test .github/scripts/release-metadata.test.cjs

      - name: Use the explicit release tag version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$RELEASE_VERSION" --allow-same-version --no-git-tag-version --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test package consumers when available
        run: npm run test:package --if-present

      - name: Publish with CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJSORG_PUBLISH_TOKEN }}
          NPM_DIST_TAG: ${{ steps.release.outputs.npm-tag }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish --access public --ignore-scripts --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org/
