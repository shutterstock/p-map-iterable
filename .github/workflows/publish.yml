name: Package and Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/configure-nodejs
        with:
          lookup-only: 'true' # We only want to lookup from the cache - if a hit, this job does nothing

  build:
    needs:
      - install-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/configure-nodejs

      - name: Use the Release Tag Version
        run: |
          npm version from-git --allow-same-version --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: NPM registry authentication
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPMJSORG_PUBLISH_TOKEN }}
        run: |
          npm set //registry.npmjs.org/:_authToken "$NPM_PUBLISH_TOKEN"
          npm config set @shutterstock:registry https://registry.npmjs.org/

      - name: Publish with CLI to NPM
        run: |
          npm publish --access public --ignore-scripts
