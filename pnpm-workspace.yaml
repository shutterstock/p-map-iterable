# Require third-party releases to be at least seven days old.
minimumReleaseAge: 10080

# Prefer copy-on-write clones on APFS, with hard-link/copy fallback elsewhere.
packageImportMethod: auto

# Native tooling used by TypeDoc and Jest; all other dependency scripts stay blocked.
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
