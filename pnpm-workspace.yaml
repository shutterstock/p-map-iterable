# Require third-party releases to be at least seven days old.
minimumReleaseAge: 10080

# Prefer copy-on-write clones on APFS, with hard-link/copy fallback elsewhere.
packageImportMethod: auto

# Corepack enforces packageManager; keep one v9 lock document for Dependabot.
pmOnFail: ignore

# Native tooling used by TypeDoc and Jest; all other dependency scripts stay blocked.
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

overrides:
  # NYC uses yaml.load(); v4 removes argparse 1's unpatched sprintf-js dependency.
  '@istanbuljs/load-nyc-config>js-yaml': '4.3.2'
